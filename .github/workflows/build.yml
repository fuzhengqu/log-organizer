name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore LogOrganizer.sln

      - name: Build (x64)
        run: dotnet build LogOrganizer.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test LogOrganizer.sln -c Release -p:Platform=x64 --no-build

      - name: Publish win-x64
        run: ./build.ps1 -Runtime win-x64 -Output publish-x64
        shell: pwsh

      - name: Publish win-arm64
        run: ./build.ps1 -Runtime win-arm64 -Output publish-arm64
        shell: pwsh

      - name: Upload win-x64
        uses: actions/upload-artifact@v4
        with:
          name: LogOrganizer-win-x64
          path: publish-x64/LogOrganizer.exe
          if-no-files-found: error

      - name: Upload win-arm64
        uses: actions/upload-artifact@v4
        with:
          name: LogOrganizer-win-arm64
          path: publish-arm64/LogOrganizer.exe
          if-no-files-found: error